<style>
.chips-menu {
    background: #fff8ed;
    padding: 50px 20px;
    text-align: center;
    font-family: Arial, sans-serif;
}

.chips-menu h2 {
    color: #713b19;
    font-size: 36px;
    margin-bottom: 10px;
}

.chips-menu .subtitle {
    color: #795b43;
    margin-bottom: 35px;
}

.chips-container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 25px;
}

.chips-card {
    background: white;
    width: 280px;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.12);
    transition: transform 0.3s;
}

.chips-card:hover {
    transform: translateY(-8px);
}

.chips-card svg {
    width: 100%;
    height: 220px;
}

.chips-card h3 {
    color: #713b19;
    font-size: 23px;
}

.chips-card p {
    color: #666;
}

.chips-price {
    color: #d97706;
    font-size: 28px;
    font-weight: bold;
}

.chips-button {
    display: inline-block;
    background: #713b19;
    color: white;
    padding: 12px 25px;
    border-radius: 25px;
    text-decoration: none;
    margin-top: 10px;
}

.chips-button:hover {
    background: #a65b25;
}
</style>
